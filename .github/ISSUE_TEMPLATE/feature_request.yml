name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does the plugin fall short today?
      placeholder: When I'm doing X, I wish I could…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your proposed solution
      description: How do you imagine this could work in the plugin?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't pick them.

  - type: checkboxes
    id: scope
    attributes:
      label: Are you up for helping?
      options:
        - label: I'd be willing to help implement this in a PR.
